version: '3'

services:
  nanites-db:
    image: mariadb
    volumes:
      - nanites-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nanites
      - MYSQL_DATABASE=nanites
      - MYSQL_USER=nanites
      - MYSQL_PASSWORD=nanites
    command: '--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci'
  nanites:
    image: nanites
    volumes:
      - ../nanites:/app
    environment:
      - NANITES_USERNAME=nanites
      - NANITES_PASSWORD=nanites
      - NANITES_HOSTNAME=nanites-db
      - NANITES_DATABASE=nanites
#      - NANITES_DEBUG=TRUE
      - NANITES_LOGLEVEL=DEBUG
      - IFX_AUTH_META_KEY=HTTP_X_REMOTE_USER
    links:
      - nanites-db
    depends_on:
      - nanites-db
    ports:
      - 8765:80
  client:
    image: nanites-client
    depends_on:
      - nanites
      - nanites-db
    volumes:
      - .:/app
    links:
      - nanites
    environment:
      - NANITES_API_BASE=http://nanites/nanites/api
      - NANITES_CLIENT_IFX_APP_TOKEN=5944af78759a6efd27aca271072e094a939dc072
#      - ENABLE_LONG_TESTS=True
volumes:
  nanites-data:
